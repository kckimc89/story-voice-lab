<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>동화 목소리 연구실</title><style>*{box-sizing:border-box}body{background:#172238;color:#f6ead2;font:18px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:22px}main{max-width:780px;margin:auto}h1{font-size:28px;margin:0 0 8px}section{background:#24334a;border-radius:18px;padding:20px;margin:16px 0}label{display:block;margin:14px 0}select,textarea,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #63758b;background:#34465f;color:#fff;width:100%}textarea{min-height:240px;line-height:1.7}input[type=range]{width:100%;accent-color:#f3d697}button{cursor:pointer;margin:5px 0}button.primary{background:#f3d697;color:#172238;font-weight:bold}.row{display:flex;gap:10px}.row>*{flex:1}small{color:#c8d3e2}#status{min-height:48px;line-height:1.5}output{color:#f3d697}</style></head><body><main><h1>🌙 동화 목소리 연구실</h1><small>V1.0 · 독립 음성 시험판</small><section><label>한국어 목소리 <select id="voice"></select></label><button id="refresh">목소리 목록 다시 확인</button><label>읽기 속도 <output id="rateOut"></output><input id="rate" type="range" min="0.55" max="1.15" step="0.05" value="0.8"></label><label>높낮이 <output id="pitchOut"></output><input id="pitch" type="range" min="0.7" max="1.3" step="0.05" value="1"></label><label>문장 사이 쉼 <output id="gapOut"></output><input id="gap" type="range" min="0" max="2.5" step="0.1" value="0.9"></label><label>문단 사이 쉼 <output id="paraOut"></output><input id="para" type="range" min="0" max="4" step="0.2" value="2"></label><button class="primary" id="play">▶ 동화 읽기</button><div class="row"><button id="sample">짧게 시험 듣기</button><button id="stop">■ 멈추기</button></div><div id="status" role="status">목소리를 선택하고 시험해 보세요.</div><small>화면을 켜 둔 채 시험해 주세요. 기기에 설치된 음성 중 Safari가 제공하는 음성만 표시됩니다.</small></section><section><label for="story">동화 원고 (수정 가능)</label><textarea id="story">콩닥, 콩닥.
어디선가 작은 북소리가 들려와요. 무슨 소리일까요?
바로 우리 몸속의 심장이 뛰는 소리랍니다.

작은 빨간 피톨이는 심장에서 여행을 시작했어요. 먼저 폐에 도착해 산소를 만났지요.
“안녕, 산소야. 나와 함께 여행을 떠나자.”
피톨이는 산소를 싣고 심장으로 돌아왔어요. 그리고 온몸으로 여행을 떠났답니다.

손가락으로, 발가락으로, 그리고 머릿속으로. 피톨이는 소중한 산소를 전해 주었어요.
우리가 잠든 지금도, 피톨이는 부지런히 여행하고 있답니다.</textarea><button id="save">원고와 설정 저장</button></section></main><script>
const $=id=>document.getElementById(id), synth=window.speechSynthesis; let voices=[],run=0,timer,active=null;const key='storyVoiceLab1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};for(const id of ['rate','pitch','gap','para','story'])if(saved[id]!=null)$(id).value=saved[id];function show(){for(const id of ['rate','pitch','gap','para'])$(id+'Out').textContent=Number($(id).value).toFixed(2)+(['gap','para'].includes(id)?'초':'배');}show();for(const id of ['rate','pitch','gap','para'])$(id).oninput=show;function refresh(){if(!synth){$('status').textContent='이 브라우저는 음성 읽기를 지원하지 않습니다.';return}const old=$('voice').value||saved.voice;voices=synth.getVoices().filter(v=>/^ko([-_]|$)/i.test(v.lang));$('voice').replaceChildren();$('voice').add(new Option('기기 기본 한국어 음성',''));voices.forEach(v=>$('voice').add(new Option(v.name+' ('+v.lang+')',v.voiceURI)));if(voices.some(v=>v.voiceURI===old))$('voice').value=old;$('status').textContent='한국어 선택 음성 '+voices.length+'개 · 기본 음성도 시험할 수 있습니다.';}if(synth){synth.addEventListener('voiceschanged',refresh);refresh();setTimeout(refresh,1000)}$('refresh').onclick=refresh;function stop(){run++;clearTimeout(timer);if(synth)synth.cancel();active=null;}$('stop').onclick=()=>{stop();$('status').textContent='읽기를 멈췄습니다.'};function chunks(text){const out=[];for(const p of text.trim().split(/\n\s*\n/)){let a=p.match(/[^.!?。！？\n]+[.!?。！？]*[”"’]?|[^\n]+/g)||[];a=a.map(x=>x.trim()).filter(Boolean);a.forEach((x,i)=>out.push({text:x,gap:i===a.length-1?'para':'gap'}))}return out;}function play(text){if(!synth)return;stop();const token=run;const list=chunks(text);if(!list.length){$('status').textContent='원고를 입력해 주세요.';return}const voice=voices.find(v=>v.voiceURI===$('voice').value),rate=+$('rate').value,pitch=+$('pitch').value;function next(i){if(token!==run)return;if(i>=list.length){$('status').textContent='동화 읽기가 끝났습니다.';active=null;return}const u=new SpeechSynthesisUtterance(list[i].text);active=u;u.lang='ko-KR';if(voice)u.voice=voice;u.rate=rate;u.pitch=pitch;u.onstart=()=>{if(token===run)$('status').textContent=(i+1)+' / '+list.length+' · '+list[i].text};u.onend=()=>{if(token===run){active=null;timer=setTimeout(()=>next(i+1),1000*Number($(list[i].gap).value));}};u.onerror=e=>{if(token===run)$('status').textContent='읽기 오류: '+e.error+' · 다른 목소리 또는 Safari에서 시험해 주세요.'};synth.speak(u);}next(0);}$('play').onclick=()=>play($('story').value);$('sample').onclick=()=>play('콩닥, 콩닥. 어디선가 작은 북소리가 들려와요. 무슨 소리일까요? 바로 우리 몸속의 심장이 뛰는 소리랍니다.');$('save').onclick=()=>{try{const s={};for(const id of ['rate','pitch','gap','para','story','voice'])s[id]=$(id).value;localStorage.setItem(key,JSON.stringify(s));$('status').textContent='원고와 설정을 저장했습니다.'}catch(e){$('status').textContent='저장 실패: '+e.message}};
</script></body></html>
